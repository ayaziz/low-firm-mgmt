server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
          - name: name
            values: ["backend", "frontend", "nginx"]
    relabel_configs:
      # Use container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Ensure job label is always present
      - replacement: loma
        target_label: job
    pipeline_stages:
      # Try to parse JSON logs from the backend (winston output)
      - json:
          expressions:
            level: level
            correlationId: correlationId
            service: service
            tenantSlug: tenantSlug
            userId: userId
            method: method
            url: url
            statusCode: statusCode
            duration: duration
            msg: message
      - labels:
          level:
          service:
          correlationId:
          tenantSlug:
